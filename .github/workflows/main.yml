name: Build LaTeX document
on:
  push:
    branches: [ release ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build Release
      id: compile
      uses: xu-cheng/texlive-action@v2
      with:
        scheme: full
        run: |
          ./build.sh
          echo "tag=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT
          echo "name=$(date +'%B %d, %Y')" >> $GITHUB_OUTPUT
          echo "files=$(echo *.pdf)" >> $GITHUB_OUTPUT
    - name: Upload CV Release
      uses: meeDamian/github-release@2.0
      if: steps.compile.conclusion == 'success' # only if we built something
      with:
        gzip: false
        allow_override: true
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{steps.compile.outputs.tag}}
        name: ${{steps.compile.outputs.name}}
        files: >
          ${{steps.compile.outputs.files}}
